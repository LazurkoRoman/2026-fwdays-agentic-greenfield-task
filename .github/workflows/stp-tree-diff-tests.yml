name: stp-tree-diff tests

on:
  push:
    paths:
      - "stp-tree-diff/**"
  pull_request:
    paths:
      - "stp-tree-diff/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stp-tree-diff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
      - name: Run demo comparison (smoke test)
        run: python3 cli.py tests/fixtures/sample_a.stp tests/fixtures/sample_b.stp -o /tmp/report.html
