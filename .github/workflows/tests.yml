name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
      - name: Run demo comparison (smoke test)
        run: |
          python3 -c "
          import cadquery as cq
          box = cq.Workplane('XY').box(10, 20, 5)
          cyl = cq.Workplane('XY').cylinder(15, 3)
          assy = cq.Assembly(name='Demo')
          assy.add(box, name='Box1')
          assy.add(cyl, name='Cylinder1', loc=cq.Location(cq.Vector(20,0,0)))
          assy.save('demo.stp', exportType='STEP')
          "
          python3 cli.py demo.stp demo.stp -o /tmp/report.html
